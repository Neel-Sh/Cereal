name: Bug report
description: Report something that is not working in Cereal
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Cereal currently builds from source on macOS 27.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Xcode
      placeholder: macOS 27, Xcode 27
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording or playback
        - Transcription
        - Enhanced notes or study material
        - Ask
        - Library or search
        - Menu bar or calls
        - Export
        - Build
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Permissions you granted, a screenshot, or output from ./script/build_and_run.sh --logs.
